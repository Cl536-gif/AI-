<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>对比测试：百炼知识库 vs 本地知识库</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f2f2;
    color: #1a1a1a;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { font-size: 18px; margin: 0; }
  #reset {
    padding: 8px 14px;
    font-size: 13px;
    border: 1px solid #d33;
    border-radius: 6px;
    background: #fff;
    color: #d33;
    cursor: pointer;
    flex: 0 0 auto;
  }
  #reset:hover { background: #fff0f0; }
  .composer { display: flex; gap: 8px; margin-bottom: 20px; }
  #question {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
  }
  #ask {
    padding: 10px 18px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background: #07c160;
    color: #fff;
    cursor: pointer;
  }
  #ask:disabled { background: #a8a8a8; cursor: not-allowed; }
  .columns { display: flex; gap: 16px; align-items: flex-start; }
  .col {
    flex: 1;
    min-width: 0;
    background: #fff;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .col h2 { font-size: 14px; margin: 0 0 12px; color: #555; flex: 0 0 auto; }
  .log {
    flex: 1;
    overflow-y: auto;
    max-height: 70vh;
    padding-right: 4px;
  }
  .turn { margin-bottom: 16px; }
  .turn:last-child { margin-bottom: 0; }
  .bubble {
    display: inline-block;
    max-width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .turn--user { text-align: right; }
  .turn--user .bubble { background: #95ec69; }
  .turn--assistant .bubble { background: #f0f0f0; }
  .status { color: #8a8a8a; font-size: 13px; }
  .error { color: #d33; font-size: 13px; }
  .empty-hint { color: #b3b3b3; font-size: 13px; }
  details { margin-top: 6px; }
  summary { cursor: pointer; font-size: 12px; color: #888; }
  .chunk {
    font-size: 12px;
    color: #444;
    background: #f7f7f7;
    border-radius: 4px;
    padding: 8px;
    margin-top: 6px;
    white-space: pre-wrap;
    text-align: left;
  }
  .chunk-meta { color: #999; margin-bottom: 4px; text-align: left; }
</style>
</head>
<body>
<div class="top-bar">
  <h1>对比测试：/api/chat（百炼 App 知识库）vs /api/chat-local（本地知识库）—— 支持多轮对话</h1>
  <button id="reset" type="button">清空对话 / 重新开始</button>
</div>

<div class="composer">
  <input id="question" type="text" placeholder="输入消息，两边各自维护自己的对话历史…" autocomplete="off" />
  <button id="ask">发送</button>
</div>

<div class="columns">
  <div class="col">
    <h2>百炼知识库模式（/api/chat）</h2>
    <div id="bailian-log" class="log"><span class="empty-hint">还没有对话，发一条消息开始测试。</span></div>
  </div>
  <div class="col">
    <h2>本地知识库模式（/api/chat-local）</h2>
    <div id="local-log" class="log"><span class="empty-hint">还没有对话，发一条消息开始测试。</span></div>
  </div>
</div>

<script>
const questionInput = document.getElementById('question');
const askBtn = document.getElementById('ask');
const resetBtn = document.getElementById('reset');
const bailianLog = document.getElementById('bailian-log');
const localLog = document.getElementById('local-log');

// 两边各自独立维护自己的多轮对话状态，互不影响
let bailianSessionId = null;
let bailianTurns = []; // [{ role: 'user'|'assistant', text }]
let localHistory = []; // [{ role: 'user'|'assistant', content }]，原样传给后端当上下文
let localTurns = []; // [{ role, text, retrieved? }]

// 清空对话时递增，用来识别"重置前发出、重置后才返回"的过期请求，
// 避免这类请求的回调把内容写回已经清空的状态里
let conversationEpoch = 0;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderBailianLog() {
  if (bailianTurns.length === 0) {
    bailianLog.innerHTML = '<span class="empty-hint">还没有对话，发一条消息开始测试。</span>';
    return;
  }
  bailianLog.innerHTML = bailianTurns.map((t) => {
    const cls = t.role === 'user' ? 'turn turn--user' : 'turn turn--assistant';
    if (t.pending) {
      return `<div class="${cls}"><span class="status">请求中…</span></div>`;
    }
    if (t.error) {
      return `<div class="${cls}"><span class="error">请求失败: ${escapeHtml(t.error)}</span></div>`;
    }
    return `<div class="${cls}"><span class="bubble">${escapeHtml(t.text)}</span></div>`;
  }).join('');
  bailianLog.scrollTop = bailianLog.scrollHeight;
}

function renderLocalLog() {
  if (localTurns.length === 0) {
    localLog.innerHTML = '<span class="empty-hint">还没有对话，发一条消息开始测试。</span>';
    return;
  }
  localLog.innerHTML = localTurns.map((t) => {
    const cls = t.role === 'user' ? 'turn turn--user' : 'turn turn--assistant';
    if (t.pending) {
      return `<div class="${cls}"><span class="status">请求中…</span></div>`;
    }
    if (t.error) {
      return `<div class="${cls}"><span class="error">请求失败: ${escapeHtml(t.error)}</span></div>`;
    }

    let html = `<div class="${cls}"><span class="bubble">${escapeHtml(t.text)}</span>`;
    if (t.retrieved) {
      html += '<details><summary>查看本轮检索到的知识库片段</summary>';
      t.retrieved.forEach((kb) => {
        html += '<div class="chunk-meta"><strong>' + escapeHtml(kb.kbName) + '</strong>' +
          (kb.error ? ('（' + escapeHtml(kb.error) + '）') : '（' + kb.chunks.length + ' 段）') + '</div>';
        kb.chunks.forEach((c) => {
          html += '<div class="chunk">综合 ' + c.hybridScore.toFixed(4) +
            '（语义 ' + c.semanticScore.toFixed(4) + ' + 关键词 ' + c.keywordScore.toFixed(4) +
            '，来源: ' + escapeHtml(c.source) + '）\n' + escapeHtml(c.text) + '</div>';
        });
      });
      html += '</details>';
    }
    html += '</div>';
    return html;
  }).join('');
  localLog.scrollTop = localLog.scrollHeight;
}

async function askBailian(message, epoch) {
  bailianTurns.push({ role: 'user', text: message });
  const pendingTurn = { role: 'assistant', pending: true };
  bailianTurns.push(pendingTurn);
  renderBailianLog();

  try {
    const body = { message, userId: 'compare-tool' };
    if (bailianSessionId) body.sessionId = bailianSessionId;

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    if (epoch !== conversationEpoch) return; // 对话已被重置，这个回复已经过期，丢弃
    bailianSessionId = data.sessionId || bailianSessionId;
    delete pendingTurn.pending;
    pendingTurn.text = data.reply;
  } catch (err) {
    if (epoch !== conversationEpoch) return;
    delete pendingTurn.pending;
    pendingTurn.error = err.message;
  }
  renderBailianLog();
}

async function askLocal(message, epoch) {
  const historyForRequest = localHistory.slice();

  localTurns.push({ role: 'user', text: message });
  const pendingTurn = { role: 'assistant', pending: true };
  localTurns.push(pendingTurn);
  renderLocalLog();

  try {
    const res = await fetch('/api/chat-local', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history: historyForRequest }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    if (epoch !== conversationEpoch) return; // 对话已被重置，这个回复已经过期，丢弃

    delete pendingTurn.pending;
    pendingTurn.text = data.reply;
    pendingTurn.retrieved = data.retrieved || [];

    // 更新历史记录，供下一轮请求带上（只存原始文本，不含检索资料）
    localHistory.push({ role: 'user', content: message });
    localHistory.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    if (epoch !== conversationEpoch) return;
    delete pendingTurn.pending;
    pendingTurn.error = err.message;
  }
  renderLocalLog();
}

async function ask() {
  const message = questionInput.value.trim();
  if (!message) return;
  const epoch = conversationEpoch;
  questionInput.value = '';
  askBtn.disabled = true;
  await Promise.all([askBailian(message, epoch), askLocal(message, epoch)]);
  askBtn.disabled = false;
  questionInput.focus();
}

function resetAll() {
  conversationEpoch += 1; // 让任何还没返回的旧请求在回调时识别出自己已经过期
  bailianSessionId = null;
  bailianTurns = [];
  localHistory = [];
  localTurns = [];
  renderBailianLog();
  renderLocalLog();
  questionInput.value = '';
  questionInput.focus();
}

askBtn.addEventListener('click', ask);
questionInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') ask();
});
resetBtn.addEventListener('click', resetAll);
</script>
</body>
</html>
